services:
  immich-frame-controller:
    build: .
    container_name: immich-frame-controller
    restart: unless-stopped
    ports:
      - "${CONTROLLER_HOST_PORT:-8082}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      DATA_DIR: /data

      IMMICH_INTERNAL_URL: "http://immich_server:2283"
      IMMICH_API_KEY: "${IMMICH_API_KEY}"
      KIOSK_INTERNAL_URL: "http://immich-kiosk:3000"
      KIOSK_PASSWORD: "${KIOSK_PASSWORD}"

      LOCAL_PUBLIC_CONTROLLER_URL: "${LOCAL_PUBLIC_CONTROLLER_URL}"
      LOCAL_PUBLIC_KIOSK_URL: "${LOCAL_PUBLIC_KIOSK_URL}"
      EXTERNAL_PUBLIC_CONTROLLER_URL: "${EXTERNAL_PUBLIC_CONTROLLER_URL:-}"
      EXTERNAL_PUBLIC_KIOSK_URL: "${EXTERNAL_PUBLIC_KIOSK_URL:-}"

      DEFAULT_FRAME_ID: lenovo
      DEFAULT_FRAME_NAME: "Lenovo Smart Frame"
      DEFAULT_NETWORK_MODE: auto
      POLL_INTERVAL_SECONDS: "20"
      CONTROLLER_API_TOKEN: "${CONTROLLER_API_TOKEN}"
    volumes:
      - ./data:/data
    networks:
      - immich_default
      - immich_kiosk_default

networks:
  immich_default:
    name: immich_default
    external: true
  immich_kiosk_default:
    name: immich-kiosk_default
    external: true
