tunnel: immich-frame
credentials-file: /etc/cloudflared/immich-frame.json

ingress:
  - hostname: frame.example.com
    path: /kiosk/*
    service: http://localhost:3000
  - hostname: frame.example.com
    # Match the Docker host port configured as CONTROLLER_HOST_PORT.
    service: http://localhost:8082
  - service: http_status:404
