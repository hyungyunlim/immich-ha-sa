set_album:
  fields:
    device_id:
      required: false
      selector:
        text:
    album_id:
      required: false
      selector:
        text:
    album_ids:
      required: false
      selector:
        object:
    album_name:
      required: false
      selector:
        text:
    album_names:
      required: false
      selector:
        object:

set_profile:
  fields:
    device_id:
      required: false
      selector:
        text:
    profile_id:
      required: true
      selector:
        text:

save_profile:
  fields:
    device_id:
      required: false
      selector:
        text:
    name:
      required: false
      selector:
        text:
    profile_id:
      required: false
      selector:
        text:
    overwrite:
      required: false
      default: true
      selector:
        boolean:

delete_profile:
  fields:
    device_id:
      required: false
      selector:
        text:
    profile_id:
      required: false
      selector:
        text:

set_people:
  fields:
    device_id:
      required: false
      selector:
        text:
    person_id:
      required: false
      selector:
        text:
    person_ids:
      required: false
      selector:
        object:
    person_name:
      required: false
      selector:
        text:
    person_names:
      required: false
      selector:
        object:

refresh_albums:
  fields:
    device_id:
      required: false
      selector:
        text:

refresh_people:
  fields:
    device_id:
      required: false
      selector:
        text:

set_renderer_options:
  fields:
    device_id:
      required: false
      selector:
        text:
    durationSeconds:
      required: false
      selector:
        number:
          min: 5
          max: 3600
          unit_of_measurement: s
    imageFit:
      required: false
      selector:
        select:
          options:
            - contain
            - cover
            - none
    customCssClass:
      required: false
      selector:
        text:
    showTime:
      required: false
      selector:
        boolean:
    timeFormat:
      required: false
      selector:
        select:
          options:
            - "24"
            - "12"
    showAmPm:
      required: false
      selector:
        boolean:
    showSeconds:
      required: false
      selector:
        boolean:
    showDate:
      required: false
      selector:
        boolean:
    dateFormat:
      required: false
      selector:
        text:
    clockSource:
      required: false
      selector:
        select:
          options:
            - client
            - server
    showWeather:
      required: false
      selector:
        boolean:
    weatherLocation:
      required: false
      selector:
        text:
    weatherRotationInterval:
      required: false
      selector:
        number:
          min: 10
          max: 3600
          step: 1
          unit_of_measurement: s
    weatherShowForecast:
      required: false
      selector:
        select:
          options:
            - inherit
            - "true"
            - "false"
    weatherShowHumidity:
      required: false
      selector:
        select:
          options:
            - inherit
            - "true"
            - "false"
    weatherShowWind:
      required: false
      selector:
        select:
          options:
            - inherit
            - "true"
            - "false"
    weatherShowWindDirection:
      required: false
      selector:
        select:
          options:
            - inherit
            - "true"
            - "false"
    weatherShowVisibility:
      required: false
      selector:
        select:
          options:
            - inherit
            - "true"
            - "false"
    weatherShowTemperatureRange:
      required: false
      selector:
        select:
          options:
            - inherit
            - "true"
            - "false"
    weatherRoundTemperature:
      required: false
      selector:
        select:
          options:
            - inherit
            - "true"
            - "false"
    activePersonIds:
      required: false
      selector:
        object:
    requireAllPeople:
      required: false
      selector:
        boolean:
    showVideos:
      required: false
      selector:
        boolean:
    excludeVideosOver:
      required: false
      selector:
        number:
          min: 0
          max: 86400
          step: 1
          unit_of_measurement: s
    showArchived:
      required: false
      selector:
        boolean:
    filterDate:
      required: false
      selector:
        text:
    filterNewest:
      required: false
      selector:
        number:
          min: 0
          max: 50000
          step: 1
    albumOrder:
      required: false
      selector:
        select:
          options:
            - random
            - newest
            - oldest
    transition:
      required: false
      selector:
        select:
          options:
            - none
            - fade
            - cross-fade
    fadeTransitionDuration:
      required: false
      selector:
        number:
          min: 0
          max: 20
          step: 0.5
          unit_of_measurement: s
    crossFadeTransitionDuration:
      required: false
      selector:
        number:
          min: 0
          max: 20
          step: 0.5
          unit_of_measurement: s
    layout:
      required: false
      selector:
        select:
          options:
            - single
            - portrait
            - landscape
            - splitview
            - splitview-landscape
    imageEffect:
      required: false
      selector:
        select:
          options:
            - none
            - zoom
            - smart-zoom
    imageEffectAmount:
      required: false
      selector:
        number:
          min: 100
          max: 1000
          step: 10
    backgroundBlur:
      required: false
      selector:
        boolean:
    backgroundBlurAmount:
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
    fontSize:
      required: false
      selector:
        number:
          min: 50
          max: 250
          step: 1
          unit_of_measurement: "%"
    frameless:
      required: false
      selector:
        boolean:
    disableNavigation:
      required: false
      selector:
        boolean:
    hideCursor:
      required: false
      selector:
        boolean:
    showProgressBar:
      required: false
      selector:
        boolean:
    progressBarPosition:
      required: false
      selector:
        select:
          options:
            - top
            - bottom
    showImageRating:
      required: false
      selector:
        boolean:
    showOwner:
      required: false
      selector:
        boolean:
    showAlbumName:
      required: false
      selector:
        boolean:
    showPersonName:
      required: false
      selector:
        boolean:
    showPersonAge:
      required: false
      selector:
        boolean:
    showImageTime:
      required: false
      selector:
        boolean:
    imageTimeFormat:
      required: false
      selector:
        select:
          options:
            - "24"
            - "12"
    showImageDate:
      required: false
      selector:
        boolean:
    imageDateFormat:
      required: false
      selector:
        text:
    showImageDescription:
      required: false
      selector:
        boolean:
    imageDescriptionScrollDuration:
      required: false
      selector:
        number:
          min: 10
          max: 240
          step: 1
          unit_of_measurement: s
    imageDescriptionScrollSpeed:
      required: false
      selector:
        number:
          min: 0.5
          max: 20
          step: 0.25
          unit_of_measurement: px/s
    imageDescriptionAreaHeight:
      required: false
      selector:
        number:
          min: 3
          max: 12
          step: 0.25
          unit_of_measurement: rem
    imageDescriptionStartDelay:
      required: false
      selector:
        number:
          min: 0
          max: 60
          step: 0.5
          unit_of_measurement: s
    imageDescriptionOverlayOpacity:
      required: false
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: "%"
    imageDescriptionLongThresholdLines:
      required: false
      selector:
        number:
          min: 2
          max: 10
          step: 0.25
          unit_of_measurement: lines
    showImageCamera:
      required: false
      selector:
        boolean:
    showImageExif:
      required: false
      selector:
        boolean:
    showImageLocation:
      required: false
      selector:
        boolean:
    showImageQr:
      required: false
      selector:
        boolean:
    showImageId:
      required: false
      selector:
        boolean:
    showUser:
      required: false
      selector:
        boolean:
    showMoreInfo:
      required: false
      selector:
        boolean:
    burnInInterval:
      required: false
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    burnInDuration:
      required: false
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    burnInOpacity:
      required: false
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    sleepStart:
      required: false
      selector:
        text:
    sleepEnd:
      required: false
      selector:
        text:
    sleepIcon:
      required: false
      selector:
        boolean:
    sleepDimScreen:
      required: false
      selector:
        boolean:
    disableSleep:
      required: false
      selector:
        boolean:

set_network_mode:
  fields:
    device_id:
      required: false
      selector:
        text:
    network_mode:
      required: true
      selector:
        select:
          options:
            - auto
            - local
            - external
